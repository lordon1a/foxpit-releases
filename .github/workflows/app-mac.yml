# Foxpit app (Go + Wails) for macOS: a test build, not a release.
# The source is not in this repo: it comes as foxpit-app-src.zip on a draft
# release (drafts are only visible to people who can write here), which is
# deleted after the build. The .app comes out as this run's artifact.
# Run: gh workflow run app-mac.yml -R lordon1a/foxpit-releases -f release_id=<draft id> -f version=0.2.0
name: Foxpit app - Mac test build

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Draft release id holding foxpit-app-src.zip'
        required: true
      version:
        description: 'App version (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - name: Get the source
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ inputs.release_id }}
        run: |
          aid=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[] | select(.name=="foxpit-app-src.zip") | .id')
          test -n "$aid"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > src.zip
          mkdir src && cd src && unzip -q ../src.zip && ls
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Build (Apple silicon + Intel)
        working-directory: src
        env:
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          V: ${{ inputs.version }}
        run: |
          go vet .
          for a in arm64 amd64; do
            GOARCH=$a go build -trimpath -ldflags="-s -w -X main.version=$V" -o "foxpit-$a" .
          done
          lipo -create -output foxpit foxpit-arm64 foxpit-amd64
          lipo -info foxpit
      - name: Starts on macOS (page + API, no window)
        working-directory: src
        run: |
          ./foxpit --dev-http 127.0.0.1:3555 & pid=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3555/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3555/ | head -c 300; echo
          curl -sf http://127.0.0.1:3555/api/backend | head -c 120; echo
          kill $pid || true
          tail -20 ~/Library/Caches/Foxpit/foxpit.log 2>/dev/null || true
      - name: Make Foxpit.app
        working-directory: src
        env:
          V: ${{ inputs.version }}
        run: |
          app=Foxpit.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          cp foxpit $app/Contents/MacOS/foxpit
          set=icon.iconset; mkdir $set
          for s in 16 32 128 256; do
            sips -z $s $s build/icon-256.png --out $set/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d build/icon-256.png --out $set/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns $set -o $app/Contents/Resources/icon.icns
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleName</key><string>Foxpit</string>' \
            '<key>CFBundleDisplayName</key><string>Foxpit</string>' \
            '<key>CFBundleExecutable</key><string>foxpit</string>' \
            '<key>CFBundleIdentifier</key><string>dev.foxpit.app</string>' \
            '<key>CFBundleIconFile</key><string>icon</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            "<key>CFBundleShortVersionString</key><string>$V</string>" \
            "<key>CFBundleVersion</key><string>$V</string>" \
            '<key>LSMinimumSystemVersion</key><string>12.0</string>' \
            '<key>NSHighResolutionCapable</key><true/>' \
            '<key>NSAppleEventsUsageDescription</key><string>Foxpit opens Terminal for account sign-in.</string>' \
            '</dict></plist>' > $app/Contents/Info.plist
          plutil -lint $app/Contents/Info.plist
          codesign --force --deep --sign - $app
          codesign --verify --verbose $app
          ditto -c -k --keepParent $app "../Foxpit-$V-mac.zip"
          ls -la ..
      - uses: actions/upload-artifact@v4
        with:
          name: Foxpit-${{ inputs.version }}-mac
          path: Foxpit-${{ inputs.version }}-mac.zip
          retention-days: 7
      - name: Delete the source draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ inputs.release_id }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$RID" || true
